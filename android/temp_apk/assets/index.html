<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Atlas — Satellite Earth Viewer</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Syne:wght@400;600;800&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #080c10;
    --panel: rgba(8,12,16,0.82);
    --border: rgba(255,255,255,0.07);
    --accent: #00e5ff;
    --accent2: #ff6b35;
    --text: #e8edf2;
    --muted: #5a6a7a;
    --layer-active: rgba(0,229,255,0.12);
  }

  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg); }

  #map {
    position: absolute; inset: 0;
    background: #080c10;
    filter: brightness(0.95) saturate(1.1);
  }

  /* Leaflet overrides */
  .leaflet-control-zoom { display: none; }
  .leaflet-attribution-flag { display: none !important; }
  .leaflet-control-attribution {
    background: rgba(8,12,16,0.6) !important;
    color: var(--muted) !important;
    font-family: 'DM Mono', monospace !important;
    font-size: 9px !important;
    backdrop-filter: blur(8px);
    border-radius: 4px 0 0 0 !important;
    border: none !important;
    padding: 3px 8px !important;
  }
  .leaflet-control-attribution a { color: var(--muted) !important; }

  /* ── Header ── */
  #header {
    position: absolute; top: 0; left: 0; right: 0; z-index: 1000;
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 20px;
    background: linear-gradient(to bottom, rgba(8,12,16,0.95) 0%, transparent 100%);
    pointer-events: none;
  }

  #logo {
    display: flex; align-items: center; gap: 10px; pointer-events: auto;
  }

  #logo-icon {
    width: 28px; height: 28px;
    border-radius: 50%;
    background: conic-gradient(from 180deg, #00e5ff 0%, #0077b6 40%, #023e8a 70%, #00e5ff 100%);
    box-shadow: 0 0 16px rgba(0,229,255,0.4);
    position: relative; overflow: hidden;
    animation: spin-slow 20s linear infinite;
  }

  @keyframes spin-slow {
    from { filter: hue-rotate(0deg); }
    to   { filter: hue-rotate(360deg); }
  }

  #logo-name {
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: 18px;
    letter-spacing: 0.08em;
    color: var(--text);
  }

  #logo-name span { color: var(--accent); }

  #coords {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.05em;
    pointer-events: none;
    text-align: right;
    line-height: 1.6;
  }

  /* ── Layer Panel ── */
  #layer-panel {
    position: absolute; left: 16px; top: 50%; transform: translateY(-50%);
    z-index: 1000;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 8px;
    backdrop-filter: blur(20px);
    display: flex; flex-direction: column; gap: 4px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
  }

  .panel-label {
    font-family: 'DM Mono', monospace;
    font-size: 8px;
    letter-spacing: 0.15em;
    color: var(--muted);
    text-transform: uppercase;
    text-align: center;
    padding: 4px 0 6px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 2px;
  }

  .layer-btn {
    display: flex; flex-direction: column; align-items: center;
    gap: 4px;
    width: 60px; padding: 8px 4px;
    border-radius: 8px;
    border: 1px solid transparent;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    transition: all 0.2s ease;
    font-family: 'DM Mono', monospace;
    font-size: 8px;
    letter-spacing: 0.05em;
  }

  .layer-btn:hover {
    background: rgba(255,255,255,0.05);
    color: var(--text);
  }

  .layer-btn.active {
    background: var(--layer-active);
    border-color: rgba(0,229,255,0.3);
    color: var(--accent);
  }

  .layer-icon {
    font-size: 18px;
    line-height: 1;
  }

  /* ── Zoom Controls ── */
  #zoom-controls {
    position: absolute; right: 16px; bottom: 80px; z-index: 1000;
    display: flex; flex-direction: column; gap: 4px;
  }

  .zoom-btn {
    width: 40px; height: 40px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 20px;
    font-family: 'DM Mono', monospace;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    backdrop-filter: blur(20px);
    transition: all 0.15s ease;
    box-shadow: 0 4px 16px rgba(0,0,0,0.4);
  }

  .zoom-btn:hover {
    background: rgba(0,229,255,0.1);
    border-color: rgba(0,229,255,0.3);
    color: var(--accent);
  }

  .zoom-btn:active { transform: scale(0.93); }

  /* ── Info Bar ── */
  #info-bar {
    position: absolute; bottom: 0; left: 0; right: 0; z-index: 1000;
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 20px;
    background: linear-gradient(to top, rgba(8,12,16,0.95) 0%, transparent 100%);
    pointer-events: none;
  }

  #zoom-level {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 0.1em;
  }

  #zoom-level strong {
    color: var(--accent);
    font-size: 13px;
  }

  #data-source {
    font-family: 'DM Mono', monospace;
    font-size: 9px;
    color: var(--muted);
    letter-spacing: 0.08em;
    text-align: right;
  }

  /* ── Search ── */
  #search-wrap {
    position: absolute; top: 70px; left: 50%; transform: translateX(-50%);
    z-index: 1000;
    width: min(360px, calc(100vw - 110px));
  }

  #search-input {
    width: 100%;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 16px 10px 38px;
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.04em;
    backdrop-filter: blur(20px);
    outline: none;
    box-shadow: 0 4px 24px rgba(0,0,0,0.4);
    transition: border-color 0.2s;
  }

  #search-input:focus { border-color: rgba(0,229,255,0.4); }
  #search-input::placeholder { color: var(--muted); }

  #search-icon {
    position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
    color: var(--muted); font-size: 14px; pointer-events: none;
  }

  #search-results {
    margin-top: 4px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    backdrop-filter: blur(20px);
    display: none;
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
  }

  .search-result {
    padding: 10px 16px;
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--text);
    cursor: pointer;
    border-bottom: 1px solid var(--border);
    transition: background 0.15s;
  }

  .search-result:last-child { border-bottom: none; }
  .search-result:hover { background: var(--layer-active); color: var(--accent); }

  /* ── Locate btn ── */
  #locate-btn {
    position: absolute; right: 16px; bottom: 130px; z-index: 1000;
    width: 40px; height: 40px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 16px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    backdrop-filter: blur(20px);
    transition: all 0.15s ease;
    box-shadow: 0 4px 16px rgba(0,0,0,0.4);
  }

  #locate-btn:hover {
    background: rgba(255,107,53,0.15);
    border-color: rgba(255,107,53,0.4);
    color: var(--accent2);
  }

  /* Pulse marker */
  .pulse-marker {
    width: 14px; height: 14px;
    background: var(--accent2);
    border-radius: 50%;
    border: 2px solid white;
    box-shadow: 0 0 0 0 rgba(255,107,53,0.6);
    animation: pulse-ring 1.5s ease-out infinite;
  }

  @keyframes pulse-ring {
    0%   { box-shadow: 0 0 0 0 rgba(255,107,53,0.6); }
    70%  { box-shadow: 0 0 0 12px rgba(255,107,53,0); }
    100% { box-shadow: 0 0 0 0 rgba(255,107,53,0); }
  }

  /* Loading overlay */
  #loading {
    position: absolute; inset: 0; z-index: 2000;
    background: var(--bg);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 16px;
    transition: opacity 0.6s ease;
  }

  #loading.hide { opacity: 0; pointer-events: none; }

  .load-globe {
    width: 56px; height: 56px;
    border-radius: 50%;
    background: conic-gradient(from 0deg, #00e5ff, #0077b6, #023e8a, #00e5ff);
    animation: spin-slow 2s linear infinite;
    box-shadow: 0 0 32px rgba(0,229,255,0.5);
  }

  .load-text {
    font-family: 'Syne', sans-serif;
    font-size: 22px; font-weight: 800;
    color: var(--text); letter-spacing: 0.1em;
  }

  .load-text span { color: var(--accent); }

  .load-sub {
    font-family: 'DM Mono', monospace;
    font-size: 10px; color: var(--muted);
    letter-spacing: 0.15em;
  }

  @media (max-width: 480px) {
    #layer-panel { left: 8px; }
    .layer-btn { width: 52px; }
    #zoom-controls { right: 8px; }
    #locate-btn { right: 8px; }
    #search-wrap { top: 64px; }
  }
</style>
</head>
<body>

<div id="loading">
  <div class="load-globe"></div>
  <div class="load-text">ATL<span>A</span>S</div>
  <div class="load-sub">SATELLITE EARTH VIEWER</div>
</div>

<div id="map"></div>

<!-- Header -->
<div id="header">
  <div id="logo">
    <div id="logo-icon"></div>
    <div id="logo-name">ATL<span>A</span>S</div>
  </div>
  <div id="coords">
    <div id="coord-lat">LAT —</div>
    <div id="coord-lng">LNG —</div>
  </div>
</div>

<!-- Search -->
<div id="search-wrap">
  <span id="search-icon">⌕</span>
  <input id="search-input" type="text" placeholder="Search any place on Earth…" autocomplete="off"/>
  <div id="search-results"></div>
</div>

<!-- Layer switcher -->
<div id="layer-panel">
  <div class="panel-label">Layers</div>
  <button class="layer-btn" data-layer="satellite" title="Satellite">
    <span class="layer-icon">🛰️</span>
    <span>Satellite</span>
  </button>
  <button class="layer-btn" data-layer="hybrid" title="Hybrid">
    <span class="layer-icon">🗺️</span>
    <span>Hybrid</span>
  </button>
  <button class="layer-btn" data-layer="terrain" title="Terrain">
    <span class="layer-icon">⛰️</span>
    <span>Terrain</span>
  </button>
  <button class="layer-btn active" data-layer="streets" title="Streets">
    <span class="layer-icon">🛣️</span>
    <span>Streets</span>
  </button>
  <button class="layer-btn" data-layer="dark" title="Dark">
    <span class="layer-icon">🌑</span>
    <span>Dark</span>
  </button>
  <button class="layer-btn" data-layer="nasa" title="NASA GIBS">
    <span class="layer-icon">🌍</span>
    <span>NASA</span>
  </button>
</div>

<!-- Locate -->
<button id="locate-btn" title="My location">📍</button>

<!-- Zoom -->
<div id="zoom-controls">
  <button class="zoom-btn" id="zoom-in">+</button>
  <button class="zoom-btn" id="zoom-out">−</button>
</div>

<!-- Info bar -->
<div id="info-bar">
  <div id="zoom-level">ZOOM <strong id="zoom-val">3</strong></div>
  <div id="data-source">OPENSTREETMAP</div>
</div>

<script>
// ── Tile Sources ──
const LAYERS = {
  satellite: {
    url: 'https://mt{s}.google.com/vt/lyrs=s&x={x}&y={y}&z={z}',
    options: { subdomains: ['0','1','2','3'] },
    attr: 'Google Satellite',
    label: 'GOOGLE SATELLITE',
    maxZoom: 20
  },
  hybrid: {
    url: 'https://mt{s}.google.com/vt/lyrs=y&x={x}&y={y}&z={z}',
    options: { subdomains: ['0','1','2','3'] },
    attr: 'Google Hybrid',
    label: 'GOOGLE HYBRID',
    maxZoom: 20
  },
  terrain: {
    url: 'https://mt{s}.google.com/vt/lyrs=p&x={x}&y={y}&z={z}',
    options: { subdomains: ['0','1','2','3'] },
    attr: 'Google Terrain',
    label: 'GOOGLE TERRAIN',
    maxZoom: 20
  },
  streets: {
    url: 'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
    attr: '© OpenStreetMap contributors',
    label: 'OPENSTREETMAP',
    maxZoom: 19
  },
  dark: {
    url: 'https://mt{s}.google.com/vt/lyrs=r&x={x}&y={y}&z={z}',
    options: { subdomains: ['0','1','2','3'] },
    attr: 'Google Maps',
    label: 'GOOGLE ROAD',
    maxZoom: 20
  },
  nasa: {
    url: (() => { const d = new Date(); d.setDate(d.getDate() - 1); return `https://gibs.earthdata.nasa.gov/wmts/epsg3857/best/MODIS_Terra_CorrectedReflectance_TrueColor/default/${d.toISOString().slice(0,10)}/GoogleMapsCompatible_Level9/{z}/{y}/{x}.jpg`; })(),
    attr: 'NASA GIBS / MODIS Terra',
    label: 'NASA MODIS TERRA',
    maxZoom: 9,
    resetZoom: 3
  }
};

// ── Init Map ──
const map = L.map('map', {
  center: [20, 0],
  zoom: 3,
  zoomControl: false,
  attributionControl: true,
  minZoom: 2,
  maxZoom: 19
});

let currentLayer = null;
let overlayLayer = null;

function setLayer(name) {
  const cfg = LAYERS[name];
  if (!cfg) return;

  if (currentLayer) map.removeLayer(currentLayer);
  if (overlayLayer) { map.removeLayer(overlayLayer); overlayLayer = null; }

  currentLayer = L.tileLayer(cfg.url, {
    attribution: cfg.attr,
    maxZoom: cfg.maxZoom || 20,
    tileSize: 256,
    ...(cfg.options || {})
  }).addTo(map);

  if (cfg.overlay) {
    overlayLayer = L.tileLayer(cfg.overlay, {
      attribution: '',
      maxZoom: 19,
      opacity: 0.8
    }).addTo(map);
  }

  if (cfg.resetZoom && map.getZoom() > cfg.resetZoom) {
    map.setZoom(cfg.resetZoom);
  }

  document.getElementById('data-source').textContent = cfg.label;

  // Update buttons
  document.querySelectorAll('.layer-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.layer === name);
  });
}

setLayer('streets');

// Hide loader once first tiles appear
currentLayer.on('load', () => {
  setTimeout(() => document.getElementById('loading').classList.add('hide'), 400);
});

// ── Coords display ──
map.on('mousemove', e => updateCoords(e.latlng));
map.on('move', () => updateCoords(map.getCenter()));

function updateCoords(latlng) {
  const lat = latlng.lat.toFixed(4);
  const lng = latlng.lng.toFixed(4);
  document.getElementById('coord-lat').textContent =
    `LAT ${lat >= 0 ? '+' : ''}${lat}°`;
  document.getElementById('coord-lng').textContent =
    `LNG ${lng >= 0 ? '+' : ''}${lng}°`;
}

// ── Zoom display ──
map.on('zoomend', () => {
  document.getElementById('zoom-val').textContent = map.getZoom();
});

// ── Layer buttons ──
document.querySelectorAll('.layer-btn').forEach(btn => {
  btn.addEventListener('click', () => setLayer(btn.dataset.layer));
});

// ── Zoom controls ──
document.getElementById('zoom-in').addEventListener('click', () => map.zoomIn());
document.getElementById('zoom-out').addEventListener('click', () => map.zoomOut());

// ── Locate ──
document.getElementById('locate-btn').addEventListener('click', () => {
  if (!navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition(pos => {
    const { latitude: lat, longitude: lng } = pos.coords;
    map.setView([lat, lng], 14, { animate: true });

    const icon = L.divIcon({
      className: '',
      html: '<div class="pulse-marker"></div>',
      iconSize: [14, 14],
      iconAnchor: [7, 7]
    });
    L.marker([lat, lng], { icon }).addTo(map);
  });
});

// ── Search via Nominatim (OSM, no key needed) ──
const searchInput = document.getElementById('search-input');
const searchResults = document.getElementById('search-results');
let searchTimer;

searchInput.addEventListener('input', () => {
  clearTimeout(searchTimer);
  const q = searchInput.value.trim();
  if (q.length < 3) { searchResults.style.display = 'none'; return; }

  searchTimer = setTimeout(async () => {
    try {
      const res = await fetch(
        `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(q)}&format=json&limit=5`,
        { headers: { 'Accept-Language': 'en' } }
      );
      const data = await res.json();
      renderResults(data);
    } catch(e) { searchResults.style.display = 'none'; }
  }, 400);
});

function renderResults(data) {
  searchResults.innerHTML = '';
  if (!data.length) { searchResults.style.display = 'none'; return; }

  data.forEach(item => {
    const div = document.createElement('div');
    div.className = 'search-result';
    div.textContent = item.display_name;
    div.addEventListener('click', () => {
      const lat = parseFloat(item.lat);
      const lng = parseFloat(item.lon);
      const bbox = item.boundingbox;
      if (bbox) {
        map.fitBounds([
          [parseFloat(bbox[0]), parseFloat(bbox[2])],
          [parseFloat(bbox[1]), parseFloat(bbox[3])]
        ], { animate: true, padding: [40, 40] });
      } else {
        map.setView([lat, lng], 12, { animate: true });
      }
      searchInput.value = item.display_name.split(',')[0];
      searchResults.style.display = 'none';
    });
    searchResults.appendChild(div);
  });

  searchResults.style.display = 'block';
}

// Close search on map click
map.on('click', () => { searchResults.style.display = 'none'; });

document.addEventListener('click', e => {
  if (!document.getElementById('search-wrap').contains(e.target)) {
    searchResults.style.display = 'none';
  }
});

// Touch pan/zoom feel on mobile
map.on('touchstart', () => {});
</script>
</body>
</html>
